/* Layout: 和紙の地に藍と朱。青海波の帯を頭に置き、罫線で区切った一覧を行ごとに並べる */
:root {
  --bg: #eee9dd;
  --surface: #f8f5ed;
  --fg: #23201c;
  --muted: #645d52;
  --line: #cdc4b1;
  --accent: #2a4a6b;
  --accent-soft: #e0e6e7;
  --seal: #b5302a;
  --seal-fg: #fbf7ee;
  --wave-a: #e7e0d0;
  --wave-b: #d8cfba;
  --pc-n: #4d5d7a;
  --pc-v: #3d6b3f;
  --pc-a: #764a8a;
  --pc-na: #8f6410;
  --pc-adv: #2a6a8c;
  --pc-o: #655e54;
  --serif: "PixelMplus12", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --sans: "PixelMplus12", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b;
    --surface: #1d2026;
    --fg: #e9e4d8;
    --muted: #aaa397;
    --line: #353a42;
    --accent: #8fb2d0;
    --accent-soft: #232c36;
    --seal: #d9675e;
    --seal-fg: #15171b;
    --wave-a: #1a1d22;
    --wave-b: #272c33;
    --pc-n: #a6b4d0;
    --pc-v: #8cc58e;
    --pc-a: #c9a3dc;
    --pc-na: #dfb65a;
    --pc-adv: #84bde0;
    --pc-o: #aaa397;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b;
  --surface: #1d2026;
  --fg: #e9e4d8;
  --muted: #aaa397;
  --line: #353a42;
  --accent: #8fb2d0;
  --accent-soft: #232c36;
  --seal: #d9675e;
  --seal-fg: #15171b;
  --wave-a: #1a1d22;
  --wave-b: #272c33;
  --pc-n: #a6b4d0;
  --pc-v: #8cc58e;
  --pc-a: #c9a3dc;
  --pc-na: #dfb65a;
  --pc-adv: #84bde0;
  --pc-o: #aaa397;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: none;
  font-smooth: never;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 760px; margin: 0 auto; min-width: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wave {
  height: 30px;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background-color: var(--wave-a);
  background-image:
    radial-gradient(circle at 100% 150%, var(--wave-a) 24%, var(--wave-b) 24%, var(--wave-b) 28%, var(--wave-a) 28%, var(--wave-a) 36%, var(--wave-b) 36%, var(--wave-b) 40%, transparent 40%, transparent),
    radial-gradient(circle at 0 150%, var(--wave-a) 24%, var(--wave-b) 24%, var(--wave-b) 28%, var(--wave-a) 28%, var(--wave-a) 36%, var(--wave-b) 36%, var(--wave-b) 40%, transparent 40%, transparent),
    radial-gradient(circle at 50% 100%, var(--wave-a) 10%, var(--wave-b) 10%, var(--wave-b) 23%, var(--wave-a) 23%, var(--wave-a) 30%, var(--wave-b) 30%, var(--wave-b) 43%, var(--wave-a) 43%, var(--wave-a) 50%, var(--wave-b) 50%, var(--wave-b) 63%, var(--wave-a) 63%, var(--wave-a) 71%, transparent 71%, transparent);
  background-size: 48px 24px;
  border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: center; gap: 14px; padding-block: 22px 8px; }
.seal {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: var(--seal);
  color: var(--seal-fg);
  font-family: var(--serif);
  font-weight: 700;
  font-size: 30px;
  line-height: 1;
  border-radius: 3px;
  transform: rotate(-3deg);
}
.top h1 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0;
  line-height: 1.35;
  margin: 0;
  text-wrap: balance;
}
.top .sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0; }

.searchbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 11;
  background: var(--bg);
  padding-block: 12px 10px;
}
.searchbar input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--fg);
  border-radius: 2px;
  padding: 11px 14px;
  font-size: 16px;
  line-height: 1.4;
}
.searchbar input::placeholder { color: var(--muted); }

.filters { display: grid; gap: 10px; padding-block: 4px 12px; }
.frow { display: flex; gap: 10px; align-items: flex-start; }
.flabel {
  flex: none;
  width: 4.2em;
  padding-top: 5px;
  font-size: 12px;
  letter-spacing: 0;
  color: var(--accent);
  font-weight: 700;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 3px 12px;
  font-size: 12px;
  line-height: 1.6;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
  font-weight: 700;
}
.switch { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; width: fit-content; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

.status {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: baseline;
  font-size: 12px;
  color: var(--muted);
  padding-block: 8px 6px;
  border-top: 3px double var(--line);
}
.status b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.linkbtn {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

.grp {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 8px;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--accent);
}
.grp::before { content: ""; width: 10px; height: 10px; background: var(--seal); transform: rotate(45deg); flex: none; }
.grp::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 3; }
.grp .n { font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; order: 2; }
.list {
  background: var(--surface);
  border: 1px solid var(--fg);
  border-radius: 2px;
  box-shadow: 3px 3px 0 var(--line);
  overflow: hidden;
}
.entry { border-top: 1px dotted var(--muted); content-visibility: auto; contain-intrinsic-size: auto 84px; }
.entry:first-child { border-top: 0; }
.entry summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 12px;
  padding: 13px 16px;
  position: relative;
}
.entry summary::-webkit-details-marker { display: none; }
.entry summary::after {
  content: "";
  position: absolute;
  right: 16px;
  bottom: 18px;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg);
  transition: transform 0.15s;
}
.entry[open] summary::after { transform: rotate(-135deg); bottom: 14px; }
.entry[open] { background: var(--accent-soft); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }

.rbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

    var nt = norm(text), marks = [], j, t, from, pos;
    for (j = 0; j < terms.length; j++) {
      t = terms[j]; from = 0;
      while ((pos = nt.indexOf(t, from)) >= 0) { marks.push([pos, pos + t.length]); from = pos + t.length; }
    }
    if (!marks.length) return esc(text);
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", cur = 0, m;
    for (j = 0; j < marks.length; j++) {
      m = marks[j];
      if (m[1] <= cur) continue;
      var st = Math.max(m[0], cur);
      out += esc(text.slice(cur, st)) + "<mark>" + esc(text.slice(st, m[1])) + "</mark>";
      cur = m[1];
    }
    return out + esc(text.slice(cur));
  }

  function meanHtml(m, terms) {
    var parts = m.split("／");
    return parts.map(function (p, idx) {
      var label = parts.length > 1 ? "<i>" + CIRCLED[idx] + "</i>" : "";
      return '<span class="sense">' + label + hl(p, terms) + "</span>";
    }).join("");
  }

  function entryHtml(it, terms) {
    var isKnown = !!known[it.id];
    var posCls = POS_CLASS[it.p] || "";
    var conj = it.c ? '<span class="kanji">' + esc(it.c) + "</span>" : "";
    var html = '<details class="entry' + (isKnown ? " known" : "") + '" data-id="' + esc(it.id) + '">' +
      "<summary>" +
      '<span class="head"><span class="word">' + hl(it.h, terms) + "</span>" +
      (it.k ? '<span class="kanji">' + hl(it.k, terms) + "</span>" : "") + "</span>" +
      '<span class="meta"><span class="pos ' + posCls + '">' + esc(it.p) + "</span>" +
      '<span class="lv lv' + it.lv + '">' + LV_LABEL[it.lv] + "</span></span>" +
      '<span class="mean">' + meanHtml(it.m, terms) + "</span>" +
      "</summary>" +
      '<div class="body"><dl style="display:grid;gap:10px;margin:0">';
    if (it.c) html += '<div class="drow"><dt>活用</dt><dd>' + esc(it.c) + "</dd></div>";
    html += '<div class="drow"><dt>例文</dt><dd><p class="ex">' + hl(it.e, terms) + '</p><p class="tr">' + hl(it.t, terms) + "</p></dd></div>";
    html += '<div class="drow"><dt>ポイント</dt><dd>' + hl(it.n, terms) + "</dd></div>";
    html += '</dl><button type="button" class="known-btn" aria-pressed="' + isKnown + '">' + (isKnown ? "覚えた" : "覚えた印をつける") + "</button></div></details>";
    return html;
  }

  function filtered(terms) {
    return ITEMS.filter(function (it) {
      if (state.pos !== "all" && it.cat !== state.pos) return false;
      if (state.lv !== "all" && String(it.lv) !== state.lv) return false;
      if (state.st === "known" && !known[it.id]) return false;
      if (state.st === "unknown" && known[it.id]) return false;
      for (var j = 0; j < terms.length; j++) { if (it.hay.indexOf(terms[j]) < 0) return false; }
      return true;
    });
  }

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");

  function countKnown() {
    var n = 0;
    for (var i = 0; i < ITEMS.length; i++) if (known[ITEMS[i].id]) n++;
    return n;
  }

  function isFiltered() {
    return state.pos !== "all" || state.lv !== "all" || state.st !== "all" || state.q.trim() !== "";
  }

  function render() {
    var terms = norm(state.q).split(/\s+/).filter(Boolean);
    var res = filtered(terms);
    if (state.sort === "lv") {
      res = res.slice().sort(function (a, b) { return a.lv - b.lv || a.i - b.i; });
    }
    var groups = [], map = {};
    res.forEach(function (it) {
      var g = state.sort === "lv" ? LV_LABEL[it.lv] : it.row;
      if (!map[g]) { map[g] = { name: g, items: [] }; groups.push(map[g]); }
      map[g].items.push(it);
    });
    var html = "";
    groups.forEach(function (g) {
      html += '<h2 class="grp">' + esc(g.name) + '<span class="n">' + g.items.length + "語</span></h2>";
      html += '<div class="list">' + g.items.map(function (it) { return entryHtml(it, terms); }).join("") + "</div>";
    });
    if (!res.length) {
      html = '<div class="list"><div class="empty">条件に合う単語がありません。<br><button type="button" class="linkbtn" data-act="reset">絞り込みを解除する</button></div></div>';
    }
    listEl.innerHTML = html;
    listEl.className = state.quiz ? "quiz" : "";
    updateStatus(res.length);
  }

  function updateStatus(shown) {
    var h = "<span><b>" + shown + "</b>語を表示（全" + ITEMS.length + "語）</span><span>覚えた <b>" + countKnown() + "</b>語</span>";
    if (isFiltered()) h += '<button type="button" class="linkbtn" data-act="reset">絞り込みを解除</button>';
    statusEl.innerHTML = h;
  }

  function makeChips(id, opts, key) {
    var el = document.getElementById(id);
    el.innerHTML = opts.map(function (o) {
      return '<button type="button" class="chip" data-v="' + o[0] + '" aria-pressed="' + (state[key] === o[0]) + '">' + o[1] + "</button>";
    }).join("");
    el.addEventListener("click", function (ev) {
      var b = ev.target.closest(".chip");
      if (!b) return;
      state[key] = b.getAttribute("data-v");
      syncChips();
      render();
    });
  }
  function syncChips() {
    [["fpos", "pos"], ["flv", "lv"], ["fst", "st"], ["fsort", "sort"]].forEach(function (p) {
      var btns = document.getElementById(p[0]).querySelectorAll(".chip");
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-v") === state[p[1]]));
      }
    });
  }

  makeChips("fpos", POS_OPTS, "pos");
  makeChips("flv", LV_OPTS, "lv");
  makeChips("fst", ST_OPTS, "st");
  makeChips("fsort", SORT_OPTS, "sort");

  var qEl = document.getElementById("q");
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = qEl.value; render(); }, 120);
  });
  document.getElementById("quiz").addEventListener("change", function (ev) {
    state.quiz = ev.target.checked;
    listEl.className = state.quiz ? "quiz" : "";
  });

  document.addEventListener("click", function (ev) {
    var reset = ev.target.closest('[data-act="reset"]');
    if (reset) {
      state.pos = "all"; state.lv = "all"; state.st = "all"; state.q = "";
      qEl.value = "";
      syncChips();
      render();
      return;
    }
    var btn = ev.target.closest(".known-btn");
    if (!btn) return;
    var entry = btn.closest(".entry");
    var id = entry.getAttribute("data-id");
    if (known[id]) delete known[id]; else known[id] = true;
    saveKnown();
    if (state.st !== "all") { render(); return; }
    var on = !!known[id];
    entry.classList.toggle("known", on);
    btn.setAttribute("aria-pressed", String(on));
    btn.textContent = on ? "覚えた" : "覚えた印をつける";
    updateStatus(listEl.querySelectorAll(".entry").length);
  });

  // ---- クイズ ----
  var MISS_KEY = "kobun-tango-miss";
  var miss = {};
  try {
    var ms = JSON.parse(localStorage.getItem(MISS_KEY) || "[]");
    for (var mi = 0; mi < ms.length; mi++) miss[ms[mi]] = true;
  } catch (e) {}
  function saveMiss() {
    try { localStorage.setItem(MISS_KEY, JSON.stringify(Object.keys(miss))); } catch (e) {}
  }

  var QORDER = ["dir", "n", "scope", "lv", "pos"];
  var QLABEL = { dir: "出題", n: "問題数", scope: "対象", lv: "重要度", pos: "品詞" };
  var QOPT = {
    dir: [["a", "古語→意味"], ["b", "意味→古語"], ["mix", "ランダム"]],
    n: [["10", "10問"], ["20", "20問"], ["30", "30問"]],
    scope: [["all", "すべて"], ["unknown", "覚えていない語"], ["miss", "間違えた語"]],
    lv: LV_OPTS,
    pos: POS_OPTS
  };
  var Q = { dir: "a", n: "10", scope: "all", lv: "all", pos: "all" };
  var G = { phase: "setup", list: [], idx: 0, score: 0, streak: 0, best: 0, wrong: [], answered: false, picked: -1 };
  var qView = document.getElementById("view-quiz");
  var dictView = document.getElementById("view-dict");

  function shuffle(a) {
    var r = a.slice(), i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function tokens(m) {
    return m.split(/[／・]/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function overlap(a, b) {
    var ta = tokens(a.m), tb = tokens(b.m);
    for (var i = 0; i < ta.length; i++) { if (tb.indexOf(ta[i]) >= 0) return true; }
    return false;
  }
  function choiceLabel(c, dir) {
    return dir === "a" ? c.m.split("／").join(" ／ ") : c.h + (c.k ? "（" + c.k + "）" : "");
  }
  function qPool() {
    return ITEMS.filter(function (it) {
      if (Q.lv !== "all" && String(it.lv) !== Q.lv) return false;
      if (Q.pos !== "all" && it.cat !== Q.pos) return false;
      if (Q.scope === "unknown" && known[it.id]) return false;
      if (Q.scope === "miss" && !miss[it.id]) return false;
      return true;
    });
  }
  function makeQ(it, dir) {
    var cands = shuffle(ITEMS.filter(function (c) {
      return c.id !== it.id && c.h !== it.h && !overlap(c, it);
    }));
    var ordered = cands.filter(function (c) { return c.cat === it.cat; })
      .concat(cands.filter(function (c) { return c.cat !== it.cat; }));
    var seen = {}, ds = [], i, lab;
    seen[choiceLabel(it, dir)] = true;
    for (i = 0; i < ordered.length && ds.length < 3; i++) {
      lab = choiceLabel(ordered[i], dir);
      if (seen[lab]) continue;
      seen[lab] = true;
      ds.push(ordered[i]);
    }
    return { it: it, dir: dir, choices: shuffle([it].concat(ds)) };
  }
  function pickDir() {
    return Q.dir === "mix" ? (Math.random() < 0.5 ? "a" : "b") : Q.dir;
  }
  function startWith(items) {
    G.list = items.map(function (it) { return makeQ(it, pickDir()); });
    G.idx = 0; G.score = 0; G.streak = 0; G.best = 0; G.wrong = [];
    G.answered = false; G.picked = -1; G.phase = "play";
    qRender();
    window.scrollTo(0, 0);
  }
  function startQuiz() {
    var pool = qPool();
    if (!pool.length) return;
    startWith(shuffle(pool).slice(0, Math.min(parseInt(Q.n, 10), pool.length)));
  }
  function answer(i) {
    if (G.phase !== "play" || G.answered) return;
    var q = G.list[G.idx];
    if (i < 0 || i >= q.choices.length) return;
    G.answered = true;
    G.picked = i;
    if (q.choices[i].id === q.it.id) {
      G.score++; G.streak++;
      if (G.streak > G.best) G.best = G.streak;
      delete miss[q.it.id];
    } else {
      G.streak = 0;
      G.wrong.push(q.it);
      miss[q.it.id] = true;
    }
    saveMiss();
    qRender();
  }
  function nextQ() {
    if (!G.answered) return;
    G.idx++;
    G.answered = false;
    G.picked = -1;
    if (G.idx >= G.list.length) G.phase = "result";
    qRender();
    window.scrollTo(0, 0);
  }

  function chipRows() {
    return QORDER.map(function (k) {
      var chips = QOPT[k].map(function (o) {
        return '<button type="button" class="chip" data-qk="' + k + '" data-v="' + o[0] + '" aria-pressed="' + (Q[k] === o[0]) + '">' + o[1] + "</button>";
      }).join("");
      return '<div class="frow"><span class="flabel">' + QLABEL[k] + '</span><div class="chips" role="group" aria-label="' + QLABEL[k] + '">' + chips + "</div></div>";
    }).join("");
  }

  function setupHtml() {
    var pool = qPool();
    var shown = Math.min(parseInt(Q.n, 10), pool.length);
    var msg;
    if (!pool.length) {
      msg = Q.scope === "miss" ? "間違えた語がまだありません。「すべて」で出題してみましょう。" : "条件に合う単語がありません。条件をゆるめてください。";
    } else {
      msg = "対象 <b>" + pool.length + "</b>語から <b>" + shown + "</b>問を出題します。";
    }
    return '<section class="qsetup"><p class="qlead">四択で古文単語を確かめます。間違えた語は記録され、あとで「間違えた語」だけを出題できます。</p>' +
      '<div class="filters">' + chipRows() + "</div>" +
      '<p class="qcount">' + msg + "</p>" +
      '<button type="button" class="startbtn" data-act="start"' + (pool.length ? "" : " disabled") + ">はじめる</button></section>";
  }

  function playHtml() {
    var q = G.list[G.idx], it = q.it, n = G.list.length;
    var done = G.idx + (G.answered ? 1 : 0);
    var h = '<div class="qhead"><span>第<b>' + (G.idx + 1) + "</b>問 / " + n + "</span><span>正解 <b>" + G.score + "</b></span>" +
      (G.streak >= 2 ? '<span class="combo">連続 <b>' + G.streak + "</b></span>" : "") + "</div>" +
      '<div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + done + '"><i style="width:' + Math.round(done / n * 100) + '%"></i></div>';
    h += '<section class="qcard"><div class="qkind">' + (q.dir === "a" ? "この語の意味は？" : "この意味の語は？") + "</div>";
    if (q.dir === "a") {
      h += '<div class="qprompt"><span class="qword">' + esc(it.h) + '</span> <span class="pos ' + (POS_CLASS[it.p] || "") + '">' + esc(it.p) + "</span></div>";
    } else {
      h += '<div class="qprompt"><span class="pos ' + (POS_CLASS[it.p] || "") + '">' + esc(it.p) + "</span> " + meanHtml(it.m, []) + "</div>";
    }
    h += '<div class="choices">';
    q.choices.forEach(function (c, i) {
      var cls = "choice";
      if (G.answered) {
        if (c.id === it.id) cls += " ok";
        else if (i === G.picked) cls += " ng";
        else cls += " dim";
      }
      h += '<button type="button" class="' + cls + '" data-act="choice" data-i="' + i + '"' + (G.answered ? " disabled" : "") + '><span class="no">' + (i + 1) + '</span><span class="ct">' + esc(choiceLabel(c, q.dir)) + "</span></button>";
    });
    h += "</div>";
    if (G.answered) {
      var ok = q.choices[G.picked].id === it.id;
      h += '<div class="fb ' + (ok ? "ok" : "ng") + '" id="fb"><p class="fbmark">' + (ok ? "正解" : "不正解") + "</p>" +
        '<p class="fbword"><span class="qword">' + esc(it.h) + "</span>" + (it.k ? ' <span class="kanji">' + esc(it.k) + "</span>" : "") + "</p>" +
        "<p>" + meanHtml(it.m, []) + "</p>" +
        '<p class="ex">' + esc(it.e) + '</p><p class="tr">' + esc(it.t) + '</p><p class="tip">' + esc(it.n) + "</p>" +
        '<button type="button" class="startbtn" data-act="next">' + (G.idx + 1 >= n ? "結果を見る" : "次の問題へ") + "</button></div>";
    }
    return h + "</section>";
  }

  function resultHtml() {
    var n = G.list.length, pct = Math.round(G.score / n * 100);
    var rank = pct === 100 ? "満点" : pct >= 80 ? "上出来" : pct >= 60 ? "あと一歩" : "復習あるのみ";
    var h = '<section class="qresult"><p class="rank">' + rank + '</p><p class="score"><b>' + G.score + "</b> / " + n + "問 正解（" + pct + "％）</p>" +
      '<p class="qcount">最高の連続正解 <b>' + G.best + "</b></p>";
    if (G.wrong.length) {
      h += '<h2 class="grp">間違えた語<span class="n">' + G.wrong.length + "語</span></h2><ul class=\"wlist\">";
      G.wrong.forEach(function (it) {
        h += '<li><span class="wh"><span class="qword">' + esc(it.h) + "</span>" + (it.k ? ' <span class="kanji">' + esc(it.k) + "</span>" : "") + "</span>" +
          "<span>" + meanHtml(it.m, []) + '</span><button type="button" class="linkbtn" data-act="dict" data-h="' + esc(it.h) + '">辞書で見る</button></li>';
      });
      h += "</ul>";
    }
    h += '<div class="rbtns"><button type="button" class="startbtn" data-act="start">もう一度</button>';
    if (G.wrong.length) h += '<button type="button" class="subbtn" data-act="retry">間違えた語だけ再挑戦</button>';
    h += '<button type="button" class="subbtn" data-act="setup">設定に戻る</button></div></section>';
    return h;
  }

  function qRender() {
    qView.innerHTML = G.phase === "setup" ? setupHtml() : G.phase === "play" ? playHtml() : resultHtml();
    if (G.phase === "play" && G.answered) {
      var nb = qView.querySelector('[data-act="next"]');
      if (nb) {
        try { nb.focus({ preventScroll: true }); } catch (e) {}
        var fb = document.getElementById("fb");
        if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest" });
      }
    }
  }

  function showTab(name) {
    var isQuiz = name === "quiz";
    dictView.hidden = isQuiz;
    qView.hidden = !isQuiz;
    document.getElementById("tab-dict").setAttribute("aria-selected", String(!isQuiz));
    document.getElementById("tab-quiz").setAttribute("aria-selected", String(isQuiz));
    if (isQuiz) qRender();
    window.scrollTo(0, 0);
  }
  document.getElementById("tab-dict").addEventListener("click", function () { showTab("dict"); });
  document.getElementById("tab-quiz").addEventListener("click", function () { showTab("quiz"); });

  qView.addEventListener("click", function (ev) {
    var chip = ev.target.closest("[data-qk]");
    if (chip) {
      Q[chip.getAttribute("data-qk")] = chip.getAttribute("data-v");
      qRender();
      return;
    }
    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "choice") answer(parseInt(b.getAttribute("data-i"), 10));
    else if (act === "next") nextQ();
    else if (act === "start") startQuiz();
    else if (act === "retry") startWith(shuffle(G.wrong));
    else if (act === "setup") { G.phase = "setup"; qRender(); }
    else if (act === "dict") {
      state.pos = "all"; state.lv = "all"; state.st = "all";
      state.q = b.getAttribute("data-h");
      qEl.value = state.q;
      syncChips();
      render();
      showTab("dict");
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (qView.hidden || G.phase !== "play") return;
    var tg = ev.target && ev.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA") return;
    if (!G.answered && ev.key >= "1" && ev.key <= "4") {
      answer(parseInt(ev.key, 10) - 1);
    } else if (G.answered && ev.key === "Enter" && document.activeElement && document.activeElement.tagName !== "BUTTON") {
      nextQ();
    }
  });

  render();
})();
</script>
